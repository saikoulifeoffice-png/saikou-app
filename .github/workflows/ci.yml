name: CI

on:
  push:
    branches: [main, "claude/**"]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test

  db-and-e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx supabase start
      - name: Write .env.local from local Supabase
        run: |
          node -e '
          const s = JSON.parse(require("child_process").execSync("npx supabase status -o json").toString().replace(/^[^{]*/, ""));
          const k = require("crypto").randomBytes(32).toString("base64");
          require("fs").writeFileSync(".env.local", [
            `NEXT_PUBLIC_SUPABASE_URL=${s.API_URL}`,
            `NEXT_PUBLIC_SUPABASE_ANON_KEY=${s.ANON_KEY}`,
            `SUPABASE_SERVICE_ROLE_KEY=${s.SERVICE_ROLE_KEY}`,
            `IDENTITY_ENCRYPTION_KEYS=1:${k}`,
            "IDENTITY_ENCRYPTION_KEY_VERSION=1",
          ].join("\n"));'
      - run: npm run test:db
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - run: npm run test:e2e
